# ============================================================
# Render Blueprint — deploy FlowNiaga sekali klik.
#
# Cara pakai:
#   1. Buka https://dashboard.render.com → New → Blueprint.
#   2. Pilih repo GitHub `flowniaga` → Render membaca file ini.
#   3. PENTING: nama service harus unik global di Render. Bila nama
#      `flowniaga-api`/`flowniaga-web` sudah dipakai orang lain, ganti
#      keduanya di file ini (mis. flowniaga-<namamu>-api) DAN sesuaikan
#      nilai API_PROXY_TARGET + API_CORS_ORIGIN di bawah.
#   4. Setelah deploy hijau, buka URL web → menu "Daftar usaha baru".
#
# Arsitektur: web (Next.js) memproksikan /api/backend/* ke API sehingga
# browser berbicara same-origin — cookie session httpOnly berfungsi penuh.
# Catatan biaya: database & web service memakai plan free (DB free
# kedaluwarsa setelah 30 hari — upgrade bila serius). Worker bertipe
# background (berbayar) dan opsional untuk Fase 2 — boleh dihapus.
# ============================================================

databases:
  - name: flowniaga-db
    databaseName: flowniaga
    user: flowniaga
    plan: free

services:
  - type: keyvalue
    name: flowniaga-redis
    plan: free
    ipAllowList: [] # hanya akses internal antar service Render

  - type: web
    name: flowniaga-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flowniaga-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flowniaga-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Sesuaikan bila nama service web diganti.
      - key: API_CORS_ORIGIN
        value: https://flowniaga-web.onrender.com
      # Cookie refresh mengikuti path yang dilihat browser lewat proxy web.
      - key: REFRESH_COOKIE_PATH
        value: /api/backend/auth

  - type: web
    name: flowniaga-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      # Dipakai saat build (rewrite proxy). Sesuaikan bila nama API diganti.
      - key: API_PROXY_TARGET
        value: https://flowniaga-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: /api/backend
      - key: NEXT_PUBLIC_APP_NAME
        value: FlowNiaga

  # Opsional (plan berbayar) — outbox dispatcher; aman dihapus untuk demo.
